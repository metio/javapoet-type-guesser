name: Release
on:
  schedule:
    - cron: 23 4 6 * *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: metio/ci/.github/workflows/maven-central-release.yml@af972ee6dd2e9f1977cb4de00247d2a29f175c76 # 2026.11.2145519
    with:
      paths: src/main/java pom.xml
    secrets: inherit
